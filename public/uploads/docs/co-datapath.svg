<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="920" height="620" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
    <marker id="ar2s" markerWidth="10" markerHeight="10" refX="2" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M8,0 L0,3 L8,6 z" fill="#475569"/>
    </marker>
    <marker id="ctr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#8b5cf6"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="919" height="619" rx="12" fill="#fbfcfe" stroke="#e2e8f0"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">单总线结构的 CPU 数据通路（运算器组织）</text>

  <!-- 主存 -->
  <rect x="50" y="70" width="170" height="110" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="135" y="115" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">主存</text>
  <text x="135" y="140" text-anchor="middle" font-size="11.5" fill="#475569">Memory</text>

  <!-- MAR / MDR -->
  <rect x="55" y="215" width="72" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="91" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">MAR</text>
  <rect x="143" y="215" width="72" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="179" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#1e3a8a">MDR</text>
  <line x1="91" y1="215" x2="91" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="98" y="203" font-size="11" fill="#475569">地址</text>
  <line x1="179" y1="215" x2="179" y2="182" stroke="#475569" stroke-width="1.6" marker-end="url(#ar2)" marker-start="url(#ar2s)"/>
  <text x="186" y="203" font-size="11" fill="#475569">数据</text>

  <!-- PC / IR -->
  <rect x="255" y="215" width="84" height="48" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="297" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">PC</text>
  <rect x="355" y="215" width="84" height="48" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="397" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#166534">IR</text>

  <!-- 寄存器组 -->
  <rect x="465" y="150" width="125" height="163" rx="8" fill="#eef7ee" stroke="#22c55e"/>
  <g fill="#dcfce7" stroke="#22c55e">
    <rect x="473" y="160" width="109" height="32" rx="4"/>
    <rect x="473" y="196" width="109" height="32" rx="4"/>
    <rect x="473" y="232" width="109" height="32" rx="4"/>
    <rect x="473" y="268" width="109" height="32" rx="4"/>
  </g>
  <g font-size="12.5" fill="#166534" text-anchor="middle" font-weight="600">
    <text x="527" y="181">R0</text>
    <text x="527" y="217">R1</text>
    <text x="527" y="253">R2</text>
    <text x="527" y="289">R3</text>
  </g>
  <text x="527" y="145" text-anchor="middle" font-size="11.5" fill="#475569">通用寄存器组</text>

  <!-- Y / Z -->
  <rect x="630" y="215" width="68" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="664" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Y</text>
  <rect x="712" y="215" width="68" height="48" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="746" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#5b21b6">Z</text>

  <!-- ALU -->
  <rect x="630" y="85" width="150" height="86" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="705" y="125" text-anchor="middle" font-size="16" font-weight="700" fill="#1e3a8a">ALU</text>
  <text x="705" y="147" text-anchor="middle" font-size="11" fill="#475569">算术 / 逻辑运算</text>
  <line x1="664" y1="215" x2="664" y2="174" stroke="#475569" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="746" y1="174" x2="746" y2="215" stroke="#475569" stroke-width="1.6" marker-end="url(#ar2)"/>

  <!-- 总线 -->
  <line x1="40" y1="330" x2="860" y2="330" stroke="#334155" stroke-width="5"/>
  <text x="90" y="352" font-size="12.5" font-weight="700" fill="#334155">单总线（内部总线）</text>

  <!-- 连线：各部件 ←→ 总线 -->
  <g stroke="#475569" stroke-width="1.6">
    <line x1="91" y1="330" x2="91" y2="266" marker-end="url(#ar2)"/>
    <line x1="179" y1="330" x2="179" y2="266" marker-end="url(#ar2)" marker-start="url(#ar2s)"/>
    <line x1="297" y1="330" x2="297" y2="266" marker-end="url(#ar2)" marker-start="url(#ar2s)"/>
    <line x1="397" y1="330" x2="397" y2="266" marker-end="url(#ar2)"/>
    <line x1="527" y1="330" x2="527" y2="316" marker-end="url(#ar2)" marker-start="url(#ar2s)"/>
    <line x1="664" y1="330" x2="664" y2="266" marker-end="url(#ar2)"/>
    <line x1="746" y1="266" x2="746" y2="330" marker-end="url(#ar2)"/>
  </g>

  <!-- 控制器 -->
  <rect x="140" y="430" width="640" height="96" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="460" y="466" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">控制器（硬布线 / 微程序）</text>
  <text x="460" y="492" text-anchor="middle" font-size="11.5" fill="#475569">产生控制信号：选通寄存器、ALU 功能选择、MAR/MDR 读写、PC 计数……</text>

  <!-- 控制信号：IR→控制器 -->
  <line x1="397" y1="263" x2="397" y2="430" stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#ctr)"/>
  <text x="404" y="380" font-size="11" fill="#5b21b6">操作码</text>

  <!-- 控制信号：控制器→各部件（示意） -->
  <g stroke="#8b5cf6" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.9">
    <line x1="560" y1="430" x2="560" y2="316" marker-end="url(#ctr)"/>
    <line x1="812" y1="430" x2="812" y2="200"/>
    <line x1="812" y1="200" x2="786" y2="200" marker-end="url(#ctr)"/>
  </g>
  <text x="566" y="404" font-size="11" fill="#5b21b6">选通信号</text>
  <text x="820" y="300" font-size="11" fill="#5b21b6">ALU 功能选择</text>

  <!-- 说明 -->
  <rect x="50" y="548" width="820" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="66" y="570" font-size="12.5" fill="#334155">单总线特点：同一时刻只允许一个部件向总线发送数据 → 一条指令要分解为多个"微操作"，分节拍完成。</text>
  <text x="66" y="590" font-size="12.5" fill="#334155">数据流向：总线 → Y → ALU → Z → 总线；地址经 MAR 送主存，数据经 MDR 进出主存。</text>
</svg>
