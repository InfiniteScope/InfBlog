<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0.5" y="0.5" width="879" height="429" rx="12" fill="#fbfcfe" stroke="#e2e8f0"/>
  <text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">三种 I/O 传送方式的 CPU 占用对比</text>

  <g font-size="12">
    <rect x="150" y="52" width="16" height="14" fill="#bbf7d0" stroke="#86efac"/><text x="172" y="64" fill="#475569">有效工作</text>
    <rect x="260" y="52" width="16" height="14" fill="#fde68a" stroke="#fcd34d"/><text x="282" y="64" fill="#475569">CPU 空等</text>
    <rect x="380" y="52" width="16" height="14" fill="#fca5a5" stroke="#f0a2a2"/><text x="402" y="64" fill="#475569">中断服务</text>
    <rect x="500" y="52" width="16" height="14" fill="#bfdbfe" stroke="#93c5fd"/><text x="522" y="64" fill="#475569">数据传送</text>
    <rect x="620" y="52" width="16" height="14" fill="#ddd6fe" stroke="#c4b5fd"/><text x="642" y="64" fill="#475569">设备 / 通道工作</text>
  </g>

  <!-- 程序查询 -->
  <text x="30" y="122" font-size="14" font-weight="700" fill="#92400e">程序查询</text>
  <g stroke="#fcd34d" stroke-width="1">
    <rect x="140" y="104" width="180" height="30" fill="#fde68a"/>
    <rect x="360" y="104" width="180" height="30" fill="#fde68a"/>
    <rect x="580" y="104" width="180" height="30" fill="#fde68a"/>
  </g>
  <g stroke="#93c5fd" stroke-width="1" fill="#bfdbfe">
    <rect x="320" y="104" width="40" height="30"/>
    <rect x="540" y="104" width="40" height="30"/>
    <rect x="760" y="104" width="30" height="30"/>
  </g>
  <text x="140" y="152" font-size="12" fill="#475569">CPU 反复查询设备状态并空转等待，利用率极低；只有数据就绪后才短暂传送</text>

  <!-- 程序中断 -->
  <text x="30" y="212" font-size="14" font-weight="700" fill="#1d4ed8">程序中断</text>
  <g stroke="#86efac" stroke-width="1" fill="#bbf7d0">
    <rect x="140" y="194" width="480" height="30"/>
  </g>
  <rect x="620" y="194" width="90" height="30" fill="#fca5a5" stroke="#f0a2a2"/>
  <rect x="710" y="194" width="80" height="30" fill="#bbf7d0" stroke="#86efac"/>
  <rect x="140" y="230" width="480" height="18" fill="#ddd6fe" stroke="#c4b5fd"/>
  <text x="380" y="243" text-anchor="middle" font-size="11" fill="#5b21b6">设备工作（与 CPU 并行）</text>
  <path d="M620,230 L620,226" stroke="#8b5cf6" stroke-width="1.6"/>
  <text x="140" y="272" font-size="12" fill="#475569">CPU 发命令后继续执行主程序；设备就绪时发出中断请求，CPU 暂停去服务，服务完再返回</text>

  <!-- DMA -->
  <text x="30" y="332" font-size="14" font-weight="700" fill="#166534">DMA</text>
  <rect x="140" y="314" width="50" height="30" fill="#fca5a5" stroke="#f0a2a2"/>
  <rect x="190" y="314" width="480" height="30" fill="#bbf7d0" stroke="#86efac"/>
  <rect x="670" y="314" width="40" height="30" fill="#fca5a5" stroke="#f0a2a2"/>
  <rect x="710" y="314" width="80" height="30" fill="#bbf7d0" stroke="#86efac"/>
  <rect x="190" y="350" width="480" height="18" fill="#bfdbfe" stroke="#93c5fd"/>
  <text x="430" y="363" text-anchor="middle" font-size="11" fill="#1e3a8a">DMA 控制器直接在主存与设备间传送整块数据</text>
  <text x="140" y="392" font-size="12" fill="#475569">CPU 只在开始初始化与结束处理时介入，传送期间完全不占用 CPU（适合高速、成块数据）</text>
</svg>
