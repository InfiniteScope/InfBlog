<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect x="0.5" y="0.5" width="879" height="469" rx="12" fill="#fbfcfe" stroke="#e2e8f0"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">五级流水线时空图（IF→ID→EX→MEM→WB）</text>

  <!-- 阶段标签 -->
  <g font-size="13" font-weight="700" fill="#334155" text-anchor="end">
    <text x="138" y="121">IF 取指</text>
    <text x="138" y="163">ID 译码</text>
    <text x="138" y="205">EX 执行</text>
    <text x="138" y="247">MEM 访存</text>
    <text x="138" y="289">WB 写回</text>
  </g>

  <!-- 时间轴标签 -->
  <g font-size="12" fill="#64748b" text-anchor="middle">
    <text x="175" y="90">t1</text>
    <text x="245" y="90">t2</text>
    <text x="315" y="90">t3</text>
    <text x="385" y="90">t4</text>
    <text x="455" y="90">t5</text>
    <text x="525" y="90">t6</text>
    <text x="595" y="90">t7</text>
    <text x="665" y="90">t8</text>
    <text x="735" y="90">t9</text>
  </g>

  <!-- grid -->
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="150" y1="100" x2="150" y2="310"/>
    <line x1="150" y1="100" x2="780" y2="100"/>
  </g>

  <!-- cells -->
  <g font-size="12" font-weight="700">
    <!-- I1 -->
    <rect x="150" y="100" width="70" height="42" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="220" y="142" width="70" height="42" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="290" y="184" width="70" height="42" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="360" y="226" width="70" height="42" fill="#dbeafe" stroke="#93c5fd"/>
    <rect x="430" y="268" width="70" height="42" fill="#dbeafe" stroke="#93c5fd"/>
    <!-- I2 -->
    <rect x="220" y="100" width="70" height="42" fill="#dcfce7" stroke="#86efac"/>
    <rect x="290" y="142" width="70" height="42" fill="#dcfce7" stroke="#86efac"/>
    <rect x="360" y="184" width="70" height="42" fill="#dcfce7" stroke="#86efac"/>
    <rect x="430" y="226" width="70" height="42" fill="#dcfce7" stroke="#86efac"/>
    <rect x="500" y="268" width="70" height="42" fill="#dcfce7" stroke="#86efac"/>
    <!-- I3 -->
    <rect x="290" y="100" width="70" height="42" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="360" y="142" width="70" height="42" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="430" y="184" width="70" height="42" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="500" y="226" width="70" height="42" fill="#fef3c7" stroke="#fcd34d"/>
    <rect x="570" y="268" width="70" height="42" fill="#fef3c7" stroke="#fcd34d"/>
    <!-- I4 -->
    <rect x="360" y="100" width="70" height="42" fill="#ede9fe" stroke="#c4b5fd"/>
    <rect x="430" y="142" width="70" height="42" fill="#ede9fe" stroke="#c4b5fd"/>
    <rect x="500" y="184" width="70" height="42" fill="#ede9fe" stroke="#c4b5fd"/>
    <rect x="570" y="226" width="70" height="42" fill="#ede9fe" stroke="#c4b5fd"/>
    <rect x="640" y="268" width="70" height="42" fill="#ede9fe" stroke="#c4b5fd"/>
    <!-- I5 -->
    <rect x="430" y="100" width="70" height="42" fill="#f3c2c2" stroke="#f0a2a2"/>
    <rect x="500" y="142" width="70" height="42" fill="#f3c2c2" stroke="#f0a2a2"/>
    <rect x="570" y="184" width="70" height="42" fill="#f3c2c2" stroke="#f0a2a2"/>
    <rect x="640" y="226" width="70" height="42" fill="#f3c2c2" stroke="#f0a2a2"/>
    <rect x="710" y="268" width="70" height="42" fill="#f3c2c2" stroke="#f0a2a2"/>
  </g>
  <g font-size="12" fill="#334155" text-anchor="middle">
    <text x="185" y="127">I1</text><text x="255" y="169">I1</text><text x="325" y="211">I1</text><text x="395" y="253">I1</text><text x="465" y="295">I1</text>
    <text x="255" y="127">I2</text><text x="325" y="169">I2</text><text x="395" y="211">I2</text><text x="465" y="253">I2</text><text x="535" y="295">I2</text>
    <text x="325" y="127">I3</text><text x="395" y="169">I3</text><text x="465" y="211">I3</text><text x="535" y="253">I3</text><text x="605" y="295">I3</text>
    <text x="395" y="127">I4</text><text x="465" y="169">I4</text><text x="535" y="211">I4</text><text x="605" y="253">I4</text><text x="675" y="295">I4</text>
    <text x="465" y="127">I5</text><text x="535" y="169">I5</text><text x="605" y="211">I5</text><text x="675" y="253">I5</text><text x="745" y="295">I5</text>
  </g>

  <line x1="150" y1="310" x2="780" y2="310" stroke="#94a3b8"/>
  <text x="775" y="330" text-anchor="end" font-size="12.5" fill="#64748b">时间 →</text>

  <rect x="40" y="350" width="800" height="96" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="60" y="377" font-size="13.5" font-weight="700" fill="#0f172a">理想加速：k 级流水线、n 条指令 → 加速比 ≈ n·k / (k + n − 1)（n→∞ 时趋近于 k）</text>
  <text x="60" y="401" font-size="13" fill="#475569">最大吞吐率 = 1 / 时钟周期；理想 CPI ≈ 1（每条流水线一个时钟周期有一条指令完成）</text>
  <text x="60" y="425" font-size="13" fill="#475569">流水线带来的三类冒险：结构冒险（资源冲突）、数据冒险（相关性）、控制冒险（转移）</text>
</svg>
