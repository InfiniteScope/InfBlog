<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="system-ui, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="amp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="429" rx="12" fill="#fbfcfe" stroke="#e2e8f0"/>
  <text x="440" y="38" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">微程序控制器的基本组成</text>

  <rect x="300" y="60" width="300" height="64" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="450" y="88" text-anchor="middle" font-size="15" font-weight="700" fill="#92400e">各功能部件</text>
  <text x="450" y="110" text-anchor="middle" font-size="12" fill="#475569">运算器 / 寄存器 / 主存 / 总线（微命令直接控制）</text>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="30" y="200" width="110" height="76" rx="8" fill="#dcfce7" stroke="#22c55e"/>
    <text x="85" y="234" fill="#166534">取指</text>
    <text x="85" y="256" fill="#166534">操作码</text>

    <rect x="170" y="200" width="160" height="76" rx="8" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="250" y="234" fill="#5b21b6">微地址形成部件</text>
    <text x="250" y="256" font-size="11.5" fill="#5b21b6">（顺序 / 转移 / 入口）</text>

    <rect x="360" y="200" width="150" height="76" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="435" y="234" fill="#1e3a8a">微地址寄存器</text>
    <text x="435" y="256" font-size="12" fill="#1e3a8a">μAR</text>

    <rect x="540" y="200" width="150" height="76" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
    <text x="615" y="228" fill="#92400e">控制存储器 CM</text>
    <text x="615" y="250" font-size="11.5" fill="#92400e">（ROM，存放微程序）</text>

    <rect x="720" y="200" width="140" height="76" rx="8" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="790" y="234" fill="#1e3a8a">微指令寄存器</text>
    <text x="790" y="256" font-size="12" fill="#1e3a8a">μIR</text>
  </g>

  <g stroke="#475569" stroke-width="1.8" marker-end="url(#amp)">
    <line x1="140" y1="238" x2="170" y2="238"/>
    <line x1="330" y1="238" x2="360" y2="238"/>
    <line x1="510" y1="238" x2="540" y2="238"/>
    <line x1="690" y1="238" x2="720" y2="238"/>
    <line x1="790" y1="200" x2="700" y2="124"/>
  </g>
  <text x="770" y="150" font-size="12" fill="#475569">微命令字段</text>

  <path d="M790,276 L790,340 L250,340 L250,276" fill="none" stroke="#8b5cf6" stroke-width="1.8" marker-end="url(#amp)"/>
  <text x="470" y="360" text-anchor="middle" font-size="12.5" fill="#5b21b6">下地址字段：决定下一条微指令地址（顺序控制）</text>

  <text x="440" y="400" text-anchor="middle" font-size="13" fill="#475569">一条机器指令 = 一段微程序；一条微指令 = 若干微命令（控制信号）+ 顺序控制信息</text>
</svg>
